name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [format, clippy]
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --locked --verbose

  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    needs: [format, clippy]
    steps:
      - uses: actions/checkout@v4
      
      # soroban-sdk 27 rejects wasm32-unknown-unknown on Rust 1.82+ (reference-types,
      # multi-value are unsupported by the Soroban environment); wasm32v1-none is the
      # supported target from Rust 1.84 on.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Build WASM (release)
        run: cargo build --locked --target wasm32v1-none --release --verbose

      - name: Install stellar-cli
        run: npm install -g @stellar/stellar-cli

      # Only cdylib crates emit a .wasm; the rlib-only registries are linked into
      # their consumers and produce no artifact here.
      - name: Optimize WASM contracts
        run: |
          shopt -s nullglob
          wasms=(target/wasm32v1-none/release/*.wasm)
          if [ ${#wasms[@]} -eq 0 ]; then
            echo "No WASM artifacts produced" >&2
            exit 1
          fi
          for contract in "${wasms[@]}"; do
            echo "Optimizing: $contract"
            stellar contract optimize --wasm "$contract"
          done

      - name: Report contract sizes
        run: |
          echo "# Contract Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for wasm in target/wasm32v1-none/release/*.wasm; do
            size=$(ls -lh "$wasm" | awk '{print $5}')
            echo "- $(basename "$wasm"): $size" >> $GITHUB_STEP_SUMMARY
          done
