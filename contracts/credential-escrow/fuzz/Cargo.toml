[package]
name = "credential-escrow-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
soroban-sdk = { version = "27.0.3", features = ["testutils"] }
credential-escrow-contract = { path = "..", features = ["testutils"] }
vc-verifier-contract = { path = "../../vc-verifier", features = ["testutils"] }
vc-issuer-registry-contract = { path = "../../vc-issuer-registry", features = ["testutils"] }
vc-schema-registry-contract = { path = "../../vc-schema-registry", features = ["testutils"] }
vc-revocation-registry-contract = { path = "../../vc-revocation-registry", features = ["testutils"] }

[workspace]

[[bin]]
name = "fuzz_escrow_settlement"
path = "fuzz_targets/fuzz_escrow_settlement.rs"
test = false
doc = false
