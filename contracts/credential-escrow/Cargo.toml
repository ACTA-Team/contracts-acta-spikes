[package]
name = "credential-escrow-contract"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lib]
crate-type = ["rlib", "cdylib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }
registry-core = { path = "../registry-core" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = { version = "1.5.0", default-features = false, features = ["std", "alloc"] }
vc-verifier-contract = { path = "../vc-verifier", features = ["testutils"] }
vc-issuer-registry-contract = { path = "../vc-issuer-registry", features = ["testutils"] }
vc-schema-registry-contract = { path = "../vc-schema-registry", features = ["testutils"] }
vc-revocation-registry-contract = { path = "../vc-revocation-registry", features = ["testutils"] }
