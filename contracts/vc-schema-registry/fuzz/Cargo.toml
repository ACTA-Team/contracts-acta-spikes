[package]
name = "vc-schema-registry-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
soroban-sdk = { version = "23.4.0", features = ["testutils"] }
vc-schema-registry-contract = { path = ".." }

# Prevent this fuzz crate from appearing in `cargo build` for the workspace
[workspace]

[[bin]]
name = "fuzz_schema_id"
path = "fuzz_targets/fuzz_schema_id.rs"
test = false
doc = false
